name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build+test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22"]
    defaults:
      run:
        shell: bash
    steps:
      # Windows hygiene, before checkout writes a single byte (CONTRACTS.md §10.3).
      - name: Configure git for Windows
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Enable corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      # CONTRACTS.md §10.3's macOS multiplier: the timing budgets in the suites read
      # OMNI_TEST_SLOW_FACTOR, so the leg that needs it has to actually set it.
      - run: pnpm -r test
        env:
          OMNI_TEST_SLOW_FACTOR: ${{ matrix.os == 'macos-latest' && '2' || '1' }}

      # Every vitest config writes vitest-report/junit.xml (CONTRACTS.md §10.3), so this glob
      # actually matches on a red run. `warn` rather than `ignore`: a silently empty artifact is
      # how a windows-only failure becomes unreproducible.
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-node${{ matrix.node }}
          path: "**/vitest-report/**"
          if-no-files-found: warn
          retention-days: 7

  static:
    name: static (lint + format + lockfile)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      # pnpm-lock.yaml has exactly one author (M0-PLAN.md §5.5); an install that
      # rewrites it is a work package reaching into scaffold-owned territory.
      - run: git diff --exit-code pnpm-lock.yaml

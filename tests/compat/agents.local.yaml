# REAL agents on THIS machine. Runs only under `OMNI_COMPAT_REAL=1`.
#
# TWO entries, and that is a statement of evidence rather than of ambition: `claude-acp` and
# `codex-acp` are the only real ACP agents on this machine, and their corpora
# (`docs/research/transcripts/claude-acp-0.73.0/`, `docs/research/transcripts/codex-acp-1.8.0/`)
# are the ground truth for every row below.
#
# THE TWO AGENTS DISAGREE ABOUT ALMOST EVERYTHING M2 IS ABOUT — claude asks permission and
# elicits, codex does neither — and that disagreement is the value: every case carries a
# `requires` list, and codex's interaction cases are printed `capability` skips sourced from its
# own recordings rather than silent passes (§27.1).
#
# ADDING AN AGENT IS AN EDIT TO THIS FILE AND NOTHING ELSE. No `.ts` file may contain a real
# agent's launch argv — the suite asserts it. An agent listed here but not usable on this machine
# is SKIPPED with a printed source and reason; a skip with no source FAILS (§18.2).
version: 1
defaults: { handshakeTimeoutMs: 90000, turnTimeoutMs: 180000, cwdStrategy: mkdtemp }
agents:
  - id: claude-acp
    source: command
    enabled: true
    command: npx
    args: ["-y", "@agentclientprotocol/claude-agent-acp@0.73.0"]
    # §6.3: on win32 an `npx` .cmd shim is REFUSED, so the direct-module form is required there.
    # This is data, not a branch — otherwise "adding an agent is a YAML edit" would be false for
    # every npx-launched runtime (review R15).
    windows:
      {
        command: "${execPath}",
        args: ["${npxResolved:@agentclientprotocol/claude-agent-acp@0.73.0}"],
      }
    # Unmet ⇒ "skipped: precondition", never a pass and never a hard failure (§18.3).
    requires: { login: "claude-code" }
    # What this runtime is expected to EXERCISE. `resume` is deliberately absent: the probe
    # measures it (`ProbeSummary.resumeMethod`) and a YAML that claimed otherwise would be a
    # second opinion about a fact we measure. The three below cannot be probed for — no method
    # battery can tell you whether an agent will reach for a tool when you ask it something —
    # and all three are recorded in the corpus (02 reads, 04 permission, 14 cancel).
    #
    # M2 adds five, each of them a claim about what this RUNTIME will exercise: it elicits
    # (claude 12/13), it answers `session/set_config_option` (15), and — since M2-WP-J wired the
    # daemon — every worker gets a policy engine, an idle watchdog, a git patch and a Run API.
    # The last four are daemon capabilities rather than agent ones, and they are listed per agent
    # because that is where `requires` is answered; an agent that could not exercise one (a
    # fixture with no tools, say) simply does not list it.
    provides: [tools, permission, cancel, elicitation, configOptions, policy, watchdog, patch, runs]
    # Observed on this machine, 2026-09-04: initialize ~7 s cold / ~1.5 s warm, `loadSession: true`,
    # sessionCapabilities list/resume/close/delete/fork.
    budgets:
      initializeMs: 30000
      resumeMs: 30000
      turnMs: 300000
    expect:
      protocolVersion: 1
      capabilities: { loadSession: true }
      resumeMethod: session/resume
      unsupportedMethods: ["session/set_model", "session/set_options", "session/notification"]
      quirks: { resumeRequiresSameCwd: true }
      # §27.2's row for this agent: `model` → `haiku`, which F34 records shrinking the returned
      # list from four entries to two. The case asserts the shrink is REAL (no phantom `effort`
      # survives on the snapshot), so the target is data here rather than a derivation.
      configOption: { id: model, value: haiku }
    # The `config` skip source (§18.3). Every reason is at least 10 characters and names the
    # evidence, because a skip nobody can argue with is the only kind worth having.
    #
    # These four name CORPUS GAPS rather than cases this suite implements — they are §18.2's own
    # rows, kept verbatim. The runner reports each one under its own name with its own reason, so
    # M1-PLAN §5's "the four corpus gaps stay visible in every run" is literally true of
    # `compat-report.json` rather than being a claim about a file nobody prints.
    skip:
      - {
          case: plan-update,
          reason: "no todo/plan tool in this build; two deliberate attempts produced no `plan` (corpus 05/05b)",
        }
      - { case: agent-thought, reason: "not emitted at default effort (corpus)" }
      - {
          case: current-mode-update,
          reason: "session/set_mode answers with the v2 config_option_update (corpus 08)",
        }
      # NOT the same thing as the `patch-git` case, which RUNS from M2 on: this row is the M1
      # corpus gap about the v1 `diff` BLOCK — its `oldText`/`newText` are widened fragments and
      # the only reconstructable patch is the vendor `structuredPatch` extension (F19). D8's
      # provider reads the disk instead, which is why it needed no agent cooperation at all.
      - {
          case: git-patch-from-diff-blocks,
          reason: "v1 diff blocks are widened fragments; a patch from them is a vendor extension (F19). D8's git provider reads the disk instead, and `patch-git` asserts that",
        }
    # Corpus gaps — the `capability` skip source. This list MIRRORS the builtin descriptor's own
    # `unverified` (CONTRACTS.md §17.2), which is the single source of truth; it is restated here
    # so an operator reading only this file can see what will not be asserted (review R8).
    unverified:
      - plan
      - agent_thought_chunk
      - current_mode_update
      - mcp
      - image_content
      - authenticate
      - tool_failure_on_merits
      # M2's five (M2-WP-J acceptance 8). Restated from `CLAUDE_ACP_UNVERIFIED`, never shortened:
      # `yaml-only.ctest.ts` asserts the two lists are the same set, because SHORTENING one is how
      # a gap becomes a silent pass.
      - elicitation_url
      - elicitation_complete
      - interaction_cancel
      - elicitation_multi_question
      - park_timeout_action
  - id: codex-acp
    source: command
    enabled: true
    command: npx
    args: ["-y", "@agentclientprotocol/codex-acp@1.8.0"]
    windows:
      { command: "${execPath}", args: ["${npxResolved:@agentclientprotocol/codex-acp@1.8.0}"] }
    # The adapter advertises only an api-key authMethod, but on this machine the ChatGPT login in
    # ~/.codex/auth.json is picked up by the bundled Codex binary without any authenticate call
    # (observed 2026-09-04: initialize 1.6 s, session/new 2.0 s, a PONG turn 5.8 s end_turn).
    requires: { login: "codex" }
    # `permission` is deliberately ABSENT. Observed 2026-09-04 (docs/research/transcripts/codex-acp-1.8.0):
    # codex-acp never sent session/request_permission for a file write — not in the default `agent`
    # mode, not after set_config_option{mode:"read-only"} / set_mode, not with INITIAL_AGENT_MODE, and
    # not for a path outside the workspace. It only asks when its own sandbox refuses a command, which
    # a compat case cannot provoke deterministically.
    #
    # `permission` and `elicitation` are deliberately ABSENT and `configOptions` is present: codex
    # answers `session/set_config_option` (codex 07, F35) and asks for nothing, ever. The four
    # daemon-side capabilities are listed for the same reason they are on claude.
    provides: [tools, cancel, configOptions, watchdog, patch, runs]
    budgets:
      initializeMs: 60000
      resumeMs: 60000
      turnMs: 300000
    expect:
      protocolVersion: 1
      capabilities: { loadSession: true }
      resumeMethod: session/resume
      # §27.2's row for codex: `mode` `agent → read-only`, whose acceptance is echoed in the full
      # returned list (codex `07`).
      configOption: { id: mode, value: read-only }
      # F35: `reasoning_effort` is not observable at all — the following turn still reports
      # `usage.thoughtTokens: 0` — so the config case asserts REPLACEMENT and never an effect.
      # A data row, not a code branch (§27.2).
      configEffectObservable: false
    skip:
      - {
          case: permission-deny,
          reason: "codex-acp 1.8.0 auto-approves file edits in every mode incl. read-only and for paths outside the workspace; no request_permission is ever sent (2026-09-04 probes)",
        }
    # Corpus gaps, restated from `CODEX_ACP_UNVERIFIED` in `packages/core/src/runtime/known.ts`,
    # which §17.2 makes the single source of truth. Never a shorter list.
    unverified:
      - permission
      - elicitation
      - elicitation_url
      - elicitation_complete
      - interaction_cancel
      - elicitation_multi_question
      - park_timeout_action
      - cmd_rules
      - mcp
      - image_content
      - authenticate
  # add the next runtime here. Zero code changes.
